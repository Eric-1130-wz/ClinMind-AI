[package]
name = "clinmind-desktop"
version = "2.0.0"
description = "ClinMind-AI 临床思维教学模拟 · 桌面壳"
authors = ["ClinMind-AI"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
