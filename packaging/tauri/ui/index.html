<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ClinMind-AI</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;color:#e6edf7;
    font-family:"Microsoft YaHei",system-ui,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px}
  .ring{width:56px;height:56px;border-radius:50%;border:3px solid #1f3355;
    border-top-color:#4f9dff;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .t{font-size:17px;letter-spacing:.5px}
  .s{font-size:12px;color:#7e93b3;max-width:560px;text-align:center;
    line-height:1.7;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="ring"></div>
  <div class="t">ClinMind-AI 正在启动…</div>
  <div class="s" id="msg">正在拉起本地推理服务，请稍候。</div>
</div>
<script>
  // 这段占位页只在后端迟迟未就绪时短暂可见；正常流程由 Rust 侧
  // 健康检查通过后直接切到 http://127.0.0.1:<port>/static/reception.html。
</script>
</body>
</html>
